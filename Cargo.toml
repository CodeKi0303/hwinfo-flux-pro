[package]
name = "hwinfo-flux-pro"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
description = "A small Windows companion that sends HWiNFO Gadget temperatures to the Antec FLUX PRO display"
license = "MIT"
authors = ["CodeKi0303"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.5"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.7", default-features = false }
winreg = "=0.56.0"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
native-windows-gui = { version = "=1.0.13", default-features = false, features = ["tray-notification", "menu", "cursor", "combobox", "notice", "high-dpi", "no-styling"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
